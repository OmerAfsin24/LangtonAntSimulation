name: Build and publish releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match release tag to project version
        shell: bash
        run: |
          version="$(sed -n 's/^project(LangtonsAntSimulation VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match project version v$version in CMakeLists.txt."
            exit 1
          fi

  build-packages:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package_generator: ZIP
            artifact: windows-x64
          - os: ubuntu-24.04
            package_generator: DEB
            artifact: ubuntu-24.04-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev ninja-build libgl1-mesa-dev libudev-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Create package
        run: cpack --config build/CPackConfig.cmake -C Release -G ${{ matrix.package_generator }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: |
            build/*.zip
            build/*.deb
          if-no-files-found: error

  publish-release:
    needs: build-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Langton's Ant Simulation ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
